[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge-engine"
version = "0.1.4"
description = "A transparent, local-first AutoML framework for automated ML pipeline discovery."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Aditya Kumar Singh", email = "adityasingh45245@gmail.com" }
]

license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "rich>=13.7",
    "typer>=0.12",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
boosting = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2"
]

optimization = [
    "optuna>=3.6"
]

dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10"
]

[project.urls]
Homepage = "https://github.com/Adityasinghrajput01/ModelForge"
Repository = "https://github.com/Adityasinghrajput01/ModelForge"
Issues = "https://github.com/Adityasinghrajput01/ModelForge/issues"

[project.scripts]
modelforge = "modelforge.cli:app"

[tool.setuptools.packages.find]
include = ["modelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]